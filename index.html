<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFC400">
<title>작업 전 안전확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: phone-first single column; sticky task header, fixed bottom action bar like a field device */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --ink:#15181B; --muted:#5A6067; --line:#D3D7D1;
  --hi:#FFC400; --hi-ink:#1A1400; --ok:#1E8048; --ok-soft:#E3F3E9; --danger:#C3301C; --danger-soft:#FBE9E5;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1B1E21; --ink:#ECEEEA; --muted:#9BA1A7; --line:#2D3135;
  --hi:#FFC400; --hi-ink:#1A1400; --ok:#43BE77; --ok-soft:#16291E; --danger:#FF6E5A; --danger-soft:#2E1915; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1B1E21; --ink:#ECEEEA; --muted:#9BA1A7; --line:#2D3135;
  --hi:#FFC400; --hi-ink:#1A1400; --ok:#43BE77; --ok-soft:#16291E; --danger:#FF6E5A; --danger-soft:#2E1915; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--hi) 0 14px,#15181B 14px 28px)}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.1;letter-spacing:-.01em}
h2{font-size:18px;font-weight:900}

/* home */
.home-head{padding-block:28px 20px;display:grid;gap:8px}
.home-head p{margin:0;color:var(--muted)}
.date{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec{padding-block:12px 20px;display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:86px;align-content:start;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ink)}
.tile:active{transform:scale(.98)}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--muted);line-height:1.4}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding-block:8px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:700;font-size:15px}
.btn.primary{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}

/* task view */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.tv-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tv-head .wrap{padding-block:12px 12px;display:grid;gap:8px}
.tv-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:0;background:none;padding:6px 0;font-weight:700;color:var(--muted)}
.ctrls{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.prog-txt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.intro{padding-block:22px 6px;display:grid;gap:10px}
.intro p{margin:0;color:var(--muted)}
.start{margin-block:6px 4px;width:100%;padding:18px;font-size:19px;border-radius:12px}
.flow{padding-block:10px 150px;display:grid;gap:22px}
.group{display:grid;gap:8px}
.group-h{display:flex;align-items:baseline;gap:10px}
.group-h .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.item{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px;transition:border-color .2s,background .2s}
.item .box{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.item .box svg{opacity:0}
.item b{display:block;font-size:17px;line-height:1.35}
.item small{display:block;font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.item.haz{border-left:8px solid var(--danger)}
.item.haz b{color:var(--danger)}
.item.cur{border-color:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 35%,transparent)}
.item.done{background:var(--ok-soft);border-color:var(--ok)}
.item.done .box{background:var(--ok);border-color:var(--ok)}
.item.done .box svg{opacity:1}
.item.haz.done{border-left-color:var(--ok)}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.skip{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.skip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item.skipped{opacity:.55;border-style:dashed}
.item.skipped b{text-decoration:line-through}
.item.skipped .box{border-style:dashed}
.item.skipped .box::after{content:"–";font-weight:900;color:var(--muted)}
.finish{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
.finish.ready{border:2px solid var(--ok)}
.finish input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.stamp{font-family:var(--mono);font-size:14px;color:var(--ok);font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.bar .wrap{display:flex;gap:8px}
.bar .btn{padding:14px 12px;white-space:nowrap}
.bar .go{flex:1;min-width:0}
.bar .go{font-size:17px}
.play{width:100%;padding:16px;font-size:17px;border-radius:10px;margin-top:4px}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}

/* qr */
.qr-form{display:grid;gap:8px;padding-block:8px 4px}
.qr-form input[type=url]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks label{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-block:14px 40px}
.labels figure{margin:0;display:grid;gap:6px}
.labels img{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff}
.labels figcaption{font-size:12px;color:var(--muted);word-break:break-all}
.qr-tmp{position:absolute;left:-9999px;top:0}

/* log */
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;padding-bottom:40px}
.log li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.log time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* etc */
.tile.etc{border-style:dashed}
.etc-form{display:grid;gap:10px;padding-bottom:40px}
.etc-form input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.haz-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.haz-list:empty{display:none}
.haz-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--danger-soft);border-left:6px solid var(--danger);border-radius:8px;padding:10px 12px}
.haz-list li span{min-width:0}
.haz-list b{color:var(--danger);display:block}
.haz-list small{display:block;color:var(--muted)}
.haz-add{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
@media (max-width:560px){.haz-add{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="app"></div>
<div id="qrTmp" class="qr-tmp" aria-hidden="true"></div>

<script>

const TASKS = [

   ["작업발판과 안전난간", "발판 고정, 난간 설치, 개구부 덮개를 확인하세요."],

  {kind:"haz", title:"위험요소", items:[

 ]},
 {id:"hotwork", name:"용접·용단", sub:"화기작업 · 가스절단 · 아크용접", sections:[
  {kind:"ppe", title:"보호구 착용", items:[

  {kind:"act", title:"비상시 행동", items:[

 ]},

   ["안전모 AE급 이상", "전기용 안전모를 착용하세요."],
   ["보안경 또는 보안면", "아크 불꽃으로부터 눈과 얼굴을 보호하세요."]]},

 get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const pad = n => String(n).padStart(2,"0");
const fmt = d => `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const WD = ["일","월","화","수","목","금","토"];
const CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- 음성 ---------- */
const tts = {
 on: store.get("sb-voice", true), rate: store.get("sb-rate4", 1.1),
 ok: "speechSynthesis" in window,
 voice(){ if(!this.ok) return null; const v=speechSynthesis.getVoices(); return v.find(x=>/ko[-_]KR/i.test(x.lang))||v.find(x=>/^ko/i.test(x.lang))||null },
 say(text){
  if(!this.ok||!this.on) return;
  speechSynthesis.cancel();
  setTimeout(()=>{ const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=this.rate; const v=this.voice(); if(v) u.voice=v; speechSynthesis.speak(u); },60);
 },
 stop(){ if(this.ok) speechSynthesis.cancel() }
};
if(tts.ok) speechSynthesis.onvoiceschanged = ()=>{};

let wake=null;
async function keepAwake(){ try{ if(navigator.wakeLock && !wake) wake = await navigator.wakeLock.request("screen"); }catch(e){} }

/* ---------- 라우팅 ---------- */
function route(){
 tts.stop();
 const h = decodeURIComponent(location.hash.slice(1));
 window.scrollTo(0,0);
 if(h==="t-etc") return renderEtc();
 if(h.startsWith("t-")){ const t=TASKS.find(x=>x.id===h.slice(2)); if(t) return renderFlow(t,"task"); }
 if(h.startsWith("p-")){ const g=GEAR.find(x=>x.id===h.slice(2)); if(g) return renderFlow(g,"gear"); }
 if(h==="qr") return renderQR();
 if(h==="log") return renderLog();
 renderHome();
}
addEventListener("hashchange", route);

/* ---------- 기타 작업 설정 ---------- */
function renderEtc(){
 const saved = store.get("sb-etc", {name:"", ppe:ETC_DEFAULT_PPE, haz:[]});
 let haz = Array.isArray(saved.haz) ? saved.haz.slice() : [];
 $("#app").innerHTML = `
 <div class="stripe"></div>
 <div class="wrap">
  <header class="home-head">
   <a class="back" href="#" style="text-decoration:none">← 작업 목록</a>
   <div class="label">기타 작업</div>
   <h1>작업 내용 입력</h1>

  </header>
  <div class="etc-form">
   <label class="label" for="etcName">작업명</label>
   <input id="etcName" type="text" placeholder="예: 배관 교체, 도장 작업, 자재 정리" value="${esc(saved.name||"")}">

   <div class="picks">${ETC_PPE.map((p,i)=>`<label><input type="checkbox" id="ep${i}" data-i="${i}" ${(saved.ppe||[]).includes(p[0])?"checked":""}> ${esc(p[0])}</label>`).join("")}</div>

 const drawHaz = ()=>{

 $("#etcGo").onclick=()=>{

  sections.push({kind:"haz", title:"위험요소", items:[...haz.map(h=>[h[0], h[1]||"이 작업에서 특히 주의할 위험입니다."]), ...ETC_HAZ]});

 };

/* ---------- 확인 흐름 (작업/보호구 공통) ---------- */
function renderFlow(data, type){
 const flat=[]; data.sections.forEach((s,si)=>s.items.forEach((it,ii)=>flat.push({si,ii,kind:s.kind,t:it[0],d:it[1],first:ii===0,sec:s})));
 const N=flat.length, done=new Set(), skip=new Set(); let cur=-1;
 const ok = i => done.has(i)||skip.has(i);
 const BATCH = new Set(type==="task" ? ["ppe","check"] : []);
 const resolved = () => flat.reduce((n,f,i)=>n+(ok(i)?1:0),0);

 $("#app").innerHTML = `
 <div class="tv-head"><div class="wrap">
  <div class="tv-top">
   <a class="back" href="#" style="text-decoration:none">← 작업 목록</a>
   <div class="ctrls">
    <button class="chip" id="vOn" aria-pressed="${tts.on}">음성 ${tts.on?"켜짐":"꺼짐"}</button>
    <button class="chip" id="vRate">속도 ${tts.rate===1.1?"보통":tts.rate<1.1?"느리게":"빠르게"}</button>
   </div>
  </div>
  <div class="prog"><i id="pg"></i></div>
  <div class="prog-txt"><span>${esc(data.name)}</span><span id="pgt">0 / ${N}</span></div>
 </div></div>
 <div class="wrap">
  <section class="intro">
   <div class="label">${type==="task"?"작업 전 안전확인":"보호구 점검"}</div>
   <h1>${esc(data.name)}</h1>
   <p>${esc(data.sub)}</p>
   ${tts.ok?"":`<p class="warn">이 기기 브라우저는 음성 안내를 지원하지 않습니다. 화면을 보며 항목을 눌러 확인하세요.</p>`}
   <button class="btn primary start" id="startBtn">음성 안내 시작</button>
   <p class="note">버튼을 누르면 항목을 하나씩 읽어 드립니다. 확인했으면 아래 큰 버튼을 누르세요.</p>
  </section>
  <div class="flow">
   ${data.sections.map((s,si)=>`
    <section class="group">
     <div class="group-h"><span class="n">${si+1}/${data.sections.length}</span><h2>${esc(s.title)}</h2></div>
     ${BATCH.has(s.kind)?`<p class="note">${s.kind==="ppe"?"착용한 보호구를 체크하고, 쓰지 않는 보호구는":"확인한 항목을 체크하고, 이번 작업과 관계없는 항목은"} '해당없음'을 누르세요. 다 체크한 뒤 음성 안내 재생 버튼을 누르면 한 번에 들려 드립니다.</p>`:""}
     ${s.items.map((it,ii)=>{const i=flat.findIndex(f=>f.si===si&&f.ii===ii);const btn=`
      <button class="item ${s.kind==="haz"?"haz":""}" data-i="${i}" id="it${i}">
       <span class="box">${CHECK_SVG}</span>
       <span><b>${esc(it[0])}</b><small>${esc(it[1])}</small></span>
      </button>`;
      return BATCH.has(s.kind)?`<div class="row">${btn}<button class="skip" data-s="${i}" id="sk${i}" aria-pressed="false" aria-label="${esc(it[0])} 이번 작업에 해당없음">해당없음</button></div>`:btn}).join("")}
     ${BATCH.has(s.kind)?`<button class="btn primary play" data-g="${si}" id="pl${si}" hidden>체크 완료 · 음성 안내 재생</button>`:""}
    </section>`).join("")}
   <section class="finish" id="finish">
    <h2>${type==="task"?"작업 시작 전 최종 확인":"점검 완료"}</h2>
    <p class="note" id="finNote">모든 항목을 확인하면 마칠 수 있습니다.</p>
    <button class="btn dark" id="saveBtn" disabled>확인 완료</button>
    <div class="stamp" id="stamp" hidden></div>
   </section>
  </div>
 </div>
 <div class="bar"><div class="wrap">
  <button class="btn" id="prevBtn" aria-label="이전 항목">이전</button>
  <button class="btn" id="againBtn" aria-label="다시 듣기">다시 듣기</button>
  <button class="btn" id="skipBtn" hidden>해당없음</button>
  <button class="btn primary go" id="goBtn">안내 시작</button>
 </div></div>`;

 // 보호구·작업 전 점검은 항목마다 읽지 않고, 그 단계를 모두 체크하면 한 번에 안내
 const isBatch = i => i>=0 && i<N && BATCH.has(flat[i].kind);
 const groupOf = i => flat.map((f,k)=>f.si===flat[i].si?k:-1).filter(k=>k>=0);
 const groupDone = i => groupOf(i).every(ok);
 const START = `작업 시작 전 위험요소 지적확인 후 시작하십시오. ${data.name} ${type==="task"?"작업 전 안전확인을":"점검을"} 시작합니다. `;
 const PROMPT = {
  ppe:"보호구 착용입니다. 착용한 보호구를 모두 체크하세요. 이번 작업에 쓰지 않는 보호구는 해당없음을 누르세요. 체크를 마치고 음성 안내 재생 버튼을 누르세요.",
  check:"작업 전 점검입니다. 점검한 항목을 모두 체크하세요. 이번 작업과 관계없는 항목은 해당없음을 누르세요. 체크를 마치고 음성 안내 재생 버튼을 누르세요."
 };
 const textFor = i => {
  const f=flat[i]; let pre = i===0 ? START : "";
  if(isBatch(i)) return pre + PROMPT[f.kind];
  if(f.first) pre += `${f.sec.title}입니다. `;
  return `${pre}${f.t}. ${f.d}`;
 };
 const summary = i => {
  const g=groupOf(i), kind=flat[i].kind;
  const yes=g.filter(k=>done.has(k)), na=g.filter(k=>skip.has(k));
  let s = kind==="ppe" ? "보호구 체크를 마쳤습니다. " : "작업 전 점검 체크를 마쳤습니다. ";
  if(yes.length) s += (kind==="ppe"?`착용한 보호구는 ${yes.map(k=>flat[k].t).join(", ")}입니다. `:`점검한 항목은 ${yes.map(k=>flat[k].t).join(", ")}입니다. `) + yes.map(k=>`${flat[k].t}, ${flat[k].d}`).join(" ") + " ";
  if(na.length) s += `해당없음은 ${na.map(k=>flat[k].t).join(", ")}입니다. `;
  return s;
 };
 const paint = () => {
  flat.forEach((f,i)=>{const el=$("#it"+i); el.classList.toggle("done",done.has(i)); el.classList.toggle("skipped",skip.has(i)); el.classList.toggle("cur",i===cur);
   const sk=$("#sk"+i); if(sk){ sk.setAttribute("aria-pressed",skip.has(i)); sk.textContent=skip.has(i)?"다시 포함":"해당없음"; }});
  const r=resolved();
  $("#pg").style.width = (r/N*100)+"%";
  $("#pgt").textContent = `${r} / ${N}` + (skip.size?` · 해당없음 ${skip.size}`:"");
  const go=$("#goBtn");
  if(cur<0) go.textContent="안내 시작";
  else if(cur>=N) go.textContent = r===N?"완료":"남은 항목 보기";
  else if(isBatch(cur)) go.textContent = groupDone(cur) ? "음성 안내 재생" : (flat[cur].kind==="ppe"?"보호구 체크 완료":"점검 체크 완료");
  else go.textContent = KIND[flat[cur].kind].btn;
  $("#skipBtn").hidden = !isBatch(cur) || groupDone(cur);
  document.querySelectorAll(".play").forEach(b=>{ const si=+b.dataset.g; b.hidden = !(isBatch(cur) && flat[cur].si===si && groupDone(cur)); });
  const all = r===N;
  $("#saveBtn").disabled=!all; $("#finish").classList.toggle("ready",all);
  $("#finNote").textContent = all?"모든 항목을 확인했습니다. 확인 완료를 누르세요." + (skip.size?` (해당없음: ${[...skip].map(i=>flat[i].t).join(", ")})`:""):`남은 항목 ${N-r}개`;
 };
 const toFinish = prefix => {
  cur=N; paint();
  $("#finish").scrollIntoView({block:"center",behavior:"smooth"});
  const left = flat.map((f,k)=>k).filter(k=>!ok(k));
  tts.say((prefix||"") + (left.length ? `확인하지 않은 항목이 ${left.length}개 있습니다. ${flat[left[0]].t}부터 확인하세요.` : `모든 항목을 확인했습니다. 확인 완료를 누르세요.`));
 };
 const goto = i => {
  if(i>=N) return toFinish();
  cur=i; paint();
  if(i>=0){ $("#it"+i).scrollIntoView({block:"center",behavior:"smooth"}); tts.say(textFor(i)); }
 };
 const nextOpen = from => { for(let k=from;k<N;k++) if(!ok(k)) return k; for(let k=0;k<N;k++) if(!ok(k)) return k; return N; };
 const batchAfter = i => {
  const g=groupOf(i);
  if(!groupDone(i)){ cur = g.find(k=>!ok(k)); paint(); return; }
  // 다 체크됨: 바로 재생하지 않고 재생 버튼을 기다림
  cur = g[g.length-1]; paint();
  const pb=$("#pl"+flat[i].si); if(pb) pb.scrollIntoView({block:"center",behavior:"smooth"});
 };
 const playGroup = i => {
  const g=groupOf(i);
  const pre = summary(i);
  const next = nextOpen(g[g.length-1]+1);
  if(next>=N) return toFinish(pre);
  cur=next; paint();
  $("#it"+next).scrollIntoView({block:"center",behavior:"smooth"});
  tts.say(pre + textFor(next));
 };
 const toggleSkip = i => {
  if(skip.has(i)){ skip.delete(i); cur=i; paint(); return; }
  skip.add(i); done.delete(i); batchAfter(i);
 };
 document.querySelectorAll(".skip").forEach(el=>el.onclick=()=>toggleSkip(+el.dataset.s));
 $("#skipBtn").onclick = ()=>{ if(isBatch(cur)) toggleSkip(cur); };
 document.querySelectorAll(".play").forEach(b=>b.onclick=()=>{ keepAwake(); const si=+b.dataset.g; const i=flat.findIndex(f=>f.si===si); if(groupDone(i)) playGroup(i); });

 $("#startBtn").onclick = ()=>{ keepAwake(); done.clear(); goto(0); };
 $("#goBtn").onclick = ()=>{
  keepAwake();
  if(cur<0) return goto(0);
  if(cur>=N) return goto(nextOpen(0));
  if(isBatch(cur)){
   if(groupDone(cur)) return playGroup(cur);
   const left=groupOf(cur).filter(k=>!ok(k));
   cur=left[0]; paint(); $("#it"+cur).scrollIntoView({block:"center",behavior:"smooth"});
   return tts.say(`체크하지 않은 항목이 ${left.length}개 있습니다. 확인했으면 체크하고, 관계없으면 해당없음을 누르세요.`);
  }
  done.add(cur); skip.delete(cur); goto(nextOpen(cur+1));
 };
 $("#prevBtn").onclick = ()=>{ if(cur>0) goto(Math.min(cur,N)-1); };
 $("#againBtn").onclick = ()=>{ if(cur<0) goto(0); else goto(cur); };
 document.querySelectorAll(".item").forEach(el=>el.onclick=()=>{
  const i=+el.dataset.i;
  if(done.has(i)){ done.delete(i); cur=i; paint(); return; }
  done.add(i); skip.delete(i);
  if(isBatch(i)) return batchAfter(i);
  const n = nextOpen(i+1);
  if(n>=N) return toFinish();
  cur=n; paint(); tts.say(textFor(n));
 });
 $("#vOn").onclick = e=>{ tts.on=!tts.on; store.set("sb-voice",tts.on); e.target.setAttribute("aria-pressed",tts.on); e.target.textContent=`음성 ${tts.on?"켜짐":"꺼짐"}`; if(!tts.on) tts.stop(); };
 $("#vRate").onclick = e=>{ const order=[1.1,1.4,0.9]; tts.rate=order[(order.indexOf(tts.rate)+1)%3]; store.set("sb-rate4",tts.rate); e.target.textContent=`속도 ${tts.rate===1.1?"보통":tts.rate<1.1?"느리게":"빠르게"}`; if(cur>=0&&cur<N) tts.say(textFor(cur)); };
 $("#saveBtn").onclick = ()=>{
  const now=new Date(); const log=store.get("sb-log",[]);
  const skipped=[...skip].map(i=>flat[i].t);
  log.unshift({name:data.logName||data.name,type,at:now.toISOString(),n:N-skip.size,skipped}); store.set("sb-log",log.slice(0,200));
  const s=$("#stamp"); s.hidden=false; s.textContent=`✔ ${fmt(now)} · ${N-skip.size}개 항목 확인 완료`;
  $("#saveBtn").disabled=true; $("#saveBtn").textContent="확인 완료됨";
  tts.say(type==="task"?"확인을 마쳤습니다. 오늘도 안전하게 작업하세요.":"점검을 마쳤습니다. 안전하게 사용하세요.");
 };
 paint();
}

/* ---------- QR 라벨 ---------- */
function renderQR(){
 const base = DEFAULT_BASE || store.get("sb-base", "");
 const all=[{h:"",name:"작업 전 안전확인",kind:"전체"},...TASKS.map(t=>({h:"t-"+t.id,name:t.name,kind:"작업"})),{h:"t-etc",name:"기타 작업",kind:"작업"},...GEAR.map(g=>({h:"p-"+g.id,name:g.name,kind:"보호구"}))];
 $("#app").innerHTML = `
 <div class="stripe"></div>
 <div class="wrap">
  <header class="home-head">
   <a class="back" href="#" style="text-decoration:none">← 작업 목록</a>
   <h1>QR 라벨 만들기</h1>
   <p>작업장 입구나 보호구 보관함에 붙일 라벨입니다. 찍으면 해당 확인 화면이 바로 열립니다.</p>
  </header>
  <div class="qr-form">
   <label class="label" for="base">이 페이지의 공유 링크</label>
   <input id="base" type="url" placeholder="https://claude.ai/artifact/..." value="${esc(base)}">
   <p class="note">현장 작업자가 볼 수 있도록 공유된 링크여야 합니다.</p>
   <div class="label" style="margin-top:8px">라벨에 넣을 항목</div>
   <div class="picks">${all.map((a,i)=>`<label><input type="checkbox" id="pk${i}" data-i="${i}" checked> ${esc(a.name)}</label>`).join("")}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
    <button class="btn primary" id="mk">라벨 만들기</button>
   </div>
   <p class="note">만든 라벨 이미지를 길게 눌러 저장하거나 우클릭으로 저장한 뒤 인쇄하세요. 코팅해서 붙이면 오래 갑니다.</p>
  </div>
  <div class="labels" id="labels"></div>
 </div>`;
 const make = async ()=>{
  const b=$("#base").value.trim().replace(/#.*$/,"");
  const out=$("#labels");
  if(!/^https?:\/\//.test(b)){ out.innerHTML=`<p class="warn" style="grid-column:1/-1">공유 링크를 먼저 붙여 넣으세요. 링크가 있어야 QR을 찍었을 때 이 페이지가 열립니다.</p>`; return; }
  if(typeof QRCode==="undefined"){ out.innerHTML=`<p class="warn" style="grid-column:1/-1">QR 생성 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.</p>`; return; }
  store.set("sb-base",b);
  try{ await document.fonts.ready }catch(e){}
  out.innerHTML="";
  const picked=[...document.querySelectorAll(".picks input:checked")].map(x=>all[+x.dataset.i]);
  for(const a of picked){
   const url = a.h ? `${b}#${a.h}` : b;
   const tmp=$("#qrTmp"); tmp.innerHTML="";
   new QRCode(tmp,{text:url,width:440,height:440,correctLevel:QRCode.CorrectLevel.M});
   const q=tmp.querySelector("canvas");
   const c=document.createElement("canvas"); c.width=560; c.height=760; const x=c.getContext("2d");
   x.fillStyle="#fff"; x.fillRect(0,0,560,760);
   x.fillStyle="#FFC400"; x.fillRect(0,0,560,96);
   x.save(); x.beginPath(); x.rect(0,84,560,12); x.clip(); x.fillStyle="#15181B";
   for(let s=-20;s<580;s+=28){ x.beginPath(); x.moveTo(s,96); x.lineTo(s+14,84); x.lineTo(s+28,84); x.lineTo(s+14,96); x.fill(); } x.restore();
   x.fillStyle="#15181B"; x.textAlign="center"; x.font='400 40px "Black Han Sans","Noto Sans KR",sans-serif';
   x.fillText("작업 전 스캔하세요",280,58);
   if(q) x.drawImage(q,60,120,440,440);
   x.font='900 48px "Noto Sans KR",sans-serif'; x.fillText(a.name,280,628);
   x.fillStyle="#5A6067"; x.font='500 24px "Noto Sans KR",sans-serif';
   x.fillText(a.kind==="전체"?"작업 선택 · 보호구 · 위험요소 음성 안내":a.kind==="작업"?"보호구 · 점검 · 위험요소 음성 안내":"보호구 점검 · 착용법 · 교체기준",280,676);
   x.font='500 18px "IBM Plex Mono",monospace'; x.fillText(a.h ? a.h.toUpperCase() : "HOME",280,724);
   const fig=document.createElement("figure");
   fig.innerHTML=`<img alt="${esc(a.name)} QR 라벨" src="${c.toDataURL("image/png")}"><figcaption>${esc(url)}</figcaption>`;
   out.appendChild(fig);
  }
 };
 $("#mk").onclick=make;
 if(base) make();
}

/* ---------- 기록 ---------- */
function renderLog(){
 const log=store.get("sb-log",[]);
 $("#app").innerHTML = `
 <div class="stripe"></div>
 <div class="wrap">
  <header class="home-head">
   <a class="back" href="#" style="text-decoration:none">← 작업 목록</a>
   <h1>내 확인 기록</h1>
   <p>이 휴대폰에만 남는 나만의 기록입니다. 다른 사람에게 전달되지 않습니다.</p>
  </header>
  ${log.length?`<ul class="log">${log.map(r=>`<li><span><b>${esc(r.name)}</b></span><time>${fmt(new Date(r.at))} · ${r.n}항목${r.skipped&&r.skipped.length?` · 해당없음 ${esc(r.skipped.join(", "))}`:""}</time></li>`).join("")}</ul>`
  :`<p class="note" style="padding-bottom:40px">아직 기록이 없습니다. 작업을 골라 확인을 마치면 여기에 남습니다.</p>`}
 </div>`;
}

route();
</script>

</body>
</html>
